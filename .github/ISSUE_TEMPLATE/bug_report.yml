name: Bug report
description: Report a problem with an Elastic Email SDK, tool or integration.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove your API key and real email addresses from everything you paste.
        For account, sending, deliverability or billing questions, use the chat widget on [elasticemail.com](https://elasticemail.com) instead.
  - type: textarea
    id: description
    attributes:
      label: What went wrong
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: A minimal code sample or the command you ran.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: The full error message, HTTP status code and stack trace, if any.
      render: text
  - type: input
    id: version
    attributes:
      label: Package or tool version
      placeholder: e.g. 4.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime and OS
      placeholder: e.g. Node.js 22, Python 3.12, .NET 8 on Ubuntu 24.04
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help.
